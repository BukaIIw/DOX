<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>DOX MUSIC — Liquid Glass Player</title>
  <meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
  <link rel="preconnect" href="https://www.youtube.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=10" />
</head>
<body>
  <!-- Liquid Glass WebGL shader background -->
  <canvas id="shaderCanvas" aria-hidden="true"></canvas>
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <!-- Toast notifications -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div class="app">
    <header class="topbar">
      <span class="brand">
        <span class="brand-mark">◈</span>
        <span class="brand-text">DOX <b>MUSIC</b></span>
      </span>
      <div class="top-actions">
        <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Настройки">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
        </button>
        <button class="icon-btn" id="langBtn" title="Switch language" aria-label="Сменить язык">
          <span id="langLabel">RU</span>
        </button>
        <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Переключить тему">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5v3m0 14v3M2 12h3m14 0h3M4.2 4.2l2.1 2.1m11.4 11.4l2.1 2.1M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" hidden><path fill="currentColor" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </header>

    <div class="status" id="status" hidden></div>

    <main class="player glass-card">
      <div class="cover" id="cover">
        <div class="cover-glow" aria-hidden="true"></div>
        <div class="cover-frame">
          <img id="coverImg" src="" alt="Обложка трека" class="cover-img" />
          <div class="cover-shine" aria-hidden="true"></div>
        </div>
        <button class="play-btn" id="playBtn" aria-label="Воспроизвести / пауза">
          <svg class="icon-play" viewBox="0 0 24 24" width="36" height="36"><path d="M8 5v14l11-7z" fill="currentColor" /></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" width="36" height="36" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor" /></svg>
        </button>
        <div class="buffering" id="buffering" hidden><span></span><span></span><span></span></div>
        <div class="mood-badge" id="moodBadge" hidden>
          <span class="mood-dot" id="moodDot"></span>
          <span id="moodLabel">—</span>
        </div>
      </div>

      <div class="meta">
        <p class="now-label" data-i18n="nowPlaying">сейчас играет</p>
        <h1 class="title" id="trackTitle">—</h1>
        <p class="artist" id="trackArtist">—</p>
        <div class="viz" id="viz" aria-hidden="true"></div>
      </div>

      <div class="progress" id="progress">
        <div class="progress-buffer" id="progressBuffer"></div>
        <div class="progress-bar" id="progressBar"></div>
        <div class="progress-knob" id="progressKnob"></div>
      </div>
      <div class="time">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>

      <div class="controls">
        <button class="ctrl toggle" id="shuffleBtn" aria-label="Перемешать" title="Перемешать">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M16 3h5v5h-2V6.4l-3.3 3.3-1.4-1.4L17.6 5H16V3zM3 5h4.6l3 3-1.4 1.4L5.6 6H3V5zm14.6 9.6L21 18v-1.6h-1V21h-5v-2h1.6l-3.3-3.3 1.4-1.4zM3 18h2.6l9-9H17v2.4l3 3V11h-1.6l-9 9H3v-2z"/></svg>
        </button>
        <button class="ctrl" id="prevBtn" aria-label="Предыдущий" title="Предыдущий">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        <button class="ctrl" id="rewindBtn" aria-label="Назад 10 сек" title="Назад 10 сек">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
        </button>
        <button class="ctrl ctrl-main" id="mainBtn" aria-label="Воспроизвести / пауза">
          <svg class="icon-play" viewBox="0 0 24 24" width="26" height="26"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" width="26" height="26" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor"/></svg>
        </button>
        <button class="ctrl" id="forwardBtn" aria-label="Вперёд 10 сек" title="Вперёд 10 сек">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 5V1l5 5-5 5V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/></svg>
        </button>
        <button class="ctrl" id="nextBtn" aria-label="Следующий" title="Следующий">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
        </button>
        <button class="ctrl toggle" id="repeatBtn" aria-label="Повтор" title="Повтор">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
          <span class="repeat-one" id="repeatOne">1</span>
        </button>
      </div>

      <div class="bottom">
        <button class="ctrl-sm" id="muteBtn" aria-label="Звук" title="Звук">
          <svg class="vol-on" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 10v4h4l5 5V5L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
          <svg class="vol-off" viewBox="0 0 24 24" width="20" height="20" hidden><path fill="currentColor" d="M3 10v4h4l5 5V5L7 10H3zm18.5-1.5L20 7l-3 3-3-3-1.5 1.5 3 3-3 3L14 19l3-3 3 3 1.5-1.5-3-3 3-3z"/></svg>
        </button>
        <input type="range" id="volume" min="0" max="100" value="80" aria-label="Громкость" />
        <button class="ctrl-sm share" id="shareBtn" aria-label="Скопировать ссылку" title="Скопировать ссылку">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M18 16.1a3 3 0 0 0-2.2 1l-7-4a3 3 0 0 0 0-2l7-4a3 3 0 1 0-.9-2.1L8 8.9a3 3 0 1 0 0 6.2l6.9 3.9A3 3 0 1 0 18 16.1z"/></svg>
        </button>
        <a class="yt-link" id="ytLink" href="#" target="_blank" rel="noopener">YouTube ↗</a>
      </div>
    </main>

    <!-- Auto-mix panel -->
    <section class="automix glass-card" aria-label="Авто-микс">
      <div class="automix-head">
        <h2 data-i18n="autoMix">Авто-микс</h2>
        <span class="automix-status" id="autoMixStatus" data-i18n="off">выкл</span>
      </div>
      <div class="mood-chips" id="moodChips">
        <button class="mood-chip" data-mood="all" data-i18n="moodAll">Все</button>
        <button class="mood-chip" data-mood="dark">Dark</button>
        <button class="mood-chip" data-mood="energetic">Energetic</button>
        <button class="mood-chip" data-mood="chill">Chill</button>
        <button class="mood-chip" data-mood="calm">Calm</button>
      </div>
      <button class="automix-btn" id="autoMixBtn">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 2v2.5A7.5 7.5 0 1 1 4.5 12H2a10 10 0 1 0 10-10zm0 6a4 4 0 1 1-4 4 4 4 0 0 1 4-4zm0-2v3l4-2-4-2v0z"/></svg>
        <span data-i18n="startAutoMix">Запустить авто-микс</span>
      </button>
      <button class="ctrl-sm regenerate" id="regenBtn" title="Сгенерировать новый трек" aria-label="Сгенерировать новый трек">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 4V1L8 5l4 4V6a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
        <span data-i18n="regenerate">Сгенерировать новый</span>
      </button>
    </section>

    <section class="playlist glass-card" aria-label="Плейлист">
      <div class="playlist-head">
        <h2 data-i18n="playlist">Плейлист</h2>
        <span class="playlist-count"><span id="trackCount">0</span> <span data-i18n="tracks">треков</span></span>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 1 0-.7.7l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
        <input type="text" id="search" placeholder="Поиск по трекам…" data-i18n-ph="searchPlaceholder" />
      </div>
      <ul id="trackList" class="track-list"></ul>
      <p class="empty" id="emptyMsg" hidden data-i18n="notFound">Ничего не найдено</p>

      <div class="load-more-row">
        <button class="load-btn" id="loadMoreBtn">
          <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M12 4V1L8 5l4 4V6a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
          <span data-i18n="loadMore">Загрузить ещё</span>
        </button>
        <button class="load-btn load-all" id="loadAllBtn">
          <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          <span data-i18n="loadAll">Загрузить до 1000 (Data API)</span>
        </button>
      </div>
    </section>

    <footer class="footer">
      <span data-i18n="blockedHint">⚠ — трек недоступен и пропущен автоматически</span>
    </footer>
  </div>

  <!-- Settings modal -->
  <div id="settingsModal" class="modal" role="dialog" aria-labelledby="settingsTitle" aria-modal="true">
    <div class="modal-card glass-card">
      <div class="modal-head">
        <h3 id="settingsTitle" data-i18n="settings">Настройки</h3>
        <button class="modal-close" id="settingsCloseBtn" aria-label="Закрыть">×</button>
      </div>
      <div class="modal-body">
        <label class="modal-label" data-i18n="apiKeyLabel">YouTube Data API v3 ключ</label>
        <input type="text" id="apiKeyInput" data-i18n-ph="apiKeyPlaceholder" placeholder="Вставьте API ключ" autocomplete="off" spellcheck="false" />
        <p class="modal-help" data-i18n="apiKeyHelp">Без ключа доступно ~160 треков. С ключом — до 1000+</p>
        <a class="modal-link" href="https://console.cloud.google.com/apis/library/youtube.googleapis.com" target="_blank" rel="noopener" data-i18n="apiKeyHelpLink">Получить ключ →</a>
        <button class="modal-save" id="apiKeySaveBtn" data-i18n="apiKeySave">Сохранить</button>
        <p class="modal-status" id="apiKeyStatus"></p>
      </div>
    </div>
  </div>

  <!-- Hidden YouTube IFrame -->
  <div id="ytMount" style="position:fixed;top:0;left:0;width:0;height:0;opacity:0;pointer-events:none;overflow:hidden;"></div>

  <!-- Liquid Glass shader (WebGL) -->
  <script src="shader.js?v=10"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="player.js?v=10"></script>
</body>
</html>
